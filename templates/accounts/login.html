{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 3M Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#8C103C', red: '#D83341', orange: '#FE8103' },
                        primary: { 500: '#FE8103', 600: '#EA580C' },
                        dark: { DEFAULT: '#0F172A', 100: '#1E293B', 200: '#334155' },
                        danger: '#EF4444',
                    },
                    fontFamily: {
                        display: ['"Red Hat Display"', 'system-ui'],
                        body: ['Inter', 'system-ui'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Red+Hat+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="h-full bg-dark flex items-center justify-center relative overflow-hidden">
    <!-- Gradient background accent -->
    <div class="absolute inset-0 opacity-20">
        <div class="absolute top-0 right-0 w-96 h-96 bg-brand-orange rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-brand-dark rounded-full blur-3xl translate-y-1/2 -translate-x-1/3"></div>
    </div>

    <div class="w-full max-w-md px-8 relative z-10">
        <div class="text-center mb-8">
            <img src="{% static 'img/logo-branca.png' %}" alt="3M Consultoria" class="h-16 mx-auto mb-4">
            <h1 class="text-3xl font-display font-bold text-white">Control</h1>
            <p class="text-gray-400 mt-1">Sistema de Gestao - 3M Consultoria</p>
        </div>

        <div class="bg-dark-100 rounded-2xl p-8 border border-dark-200/50 shadow-2xl">
            {% if error %}
            <div class="mb-4 px-4 py-3 rounded-lg bg-danger/10 text-danger text-sm border border-danger/20">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="space-y-5">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Usuario</label>
                        <input type="text" name="username" id="username" required autofocus
                               class="w-full px-4 py-3 bg-dark border border-dark-200 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent transition"
                               placeholder="Seu usuario">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Senha</label>
                        <input type="password" name="password" id="password" required
                               class="w-full px-4 py-3 bg-dark border border-dark-200 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent transition"
                               placeholder="Sua senha">
                    </div>
                    <button type="submit"
                            class="w-full py-3 bg-gradient-to-r from-brand-dark via-brand-red to-brand-orange hover:opacity-90 text-white font-semibold rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:ring-offset-2 focus:ring-offset-dark">
                        Entrar
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-gray-500 text-xs mt-8">3M Consultoria &copy; 2026</p>
    </div>
</body>
</html>
