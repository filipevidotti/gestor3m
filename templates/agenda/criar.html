{% extends "base.html" %}
{% block title %}Novo Agendamento — 3M Control{% endblock %}
{% block page_title %}Novo Agendamento{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-6">
    <div class="flex items-center gap-3">
        <a href="{% url 'agenda:visualizar' %}" class="text-gray-400 hover:text-brand-orange transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <h1 class="text-2xl font-display font-bold text-gray-900 dark:text-white">Novo Agendamento</h1>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div class="bg-white dark:bg-dark-100 rounded-xl border border-gray-200 dark:border-gray-700/50 p-6 space-y-4">
            <h3 class="text-sm font-display font-semibold text-gray-900 dark:text-white uppercase tracking-wider">Dados da Reunião</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Data *</label>
                    <input type="date" name="data" required value="{{ request.GET.data }}"
                           class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Horário *</label>
                    <input type="time" name="horario" required
                           class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Duração (minutos)</label>
                <select name="duracao"
                        class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange">
                    <option value="30" {% if duracao_padrao == 30 %}selected{% endif %}>30 minutos</option>
                    <option value="45" {% if duracao_padrao == 45 %}selected{% endif %}>45 minutos</option>
                    <option value="60" {% if duracao_padrao == 60 %}selected{% endif %}>60 minutos</option>
                    <option value="90" {% if duracao_padrao == 90 %}selected{% endif %}>90 minutos</option>
                    <option value="120" {% if duracao_padrao == 120 %}selected{% endif %}>120 minutos</option>
                </select>
            </div>
        </div>

        <div class="bg-white dark:bg-dark-100 rounded-xl border border-gray-200 dark:border-gray-700/50 p-6 space-y-4">
            <h3 class="text-sm font-display font-semibold text-gray-900 dark:text-white uppercase tracking-wider">Participante</h3>

            <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Cliente (opcional)</label>
                <select name="cliente" id="cliente-select"
                        onchange="preencherCliente(this)"
                        class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange">
                    <option value="">— Sem vínculo com cliente —</option>
                    {% for c in clientes %}
                    <option value="{{ c.pk }}" data-nome="{{ c.empresa }}" data-email="{{ c.email }}" data-telefone="{{ c.telefone }}">{{ c.empresa }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Nome *</label>
                <input type="text" name="nome" id="campo-nome" required
                       class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange"
                       placeholder="Nome do participante">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">E-mail</label>
                    <input type="email" name="email" id="campo-email"
                           class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange"
                           placeholder="email@exemplo.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Telefone</label>
                    <input type="text" name="telefone" id="campo-telefone"
                           class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange"
                           placeholder="(00) 00000-0000">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Observação</label>
                <textarea name="observacao" rows="3"
                          class="w-full bg-gray-50 dark:bg-dark border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white px-3 py-2 text-sm focus:ring-brand-orange focus:border-brand-orange"
                          placeholder="Assunto da reunião, pauta..."></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-3">
            <a href="{% url 'agenda:visualizar' %}" class="px-4 py-2 bg-gray-100 dark:bg-dark-200 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-200 dark:hover:bg-dark-300 transition">Cancelar</a>
            <button type="submit" class="px-6 py-2 bg-brand-orange text-white rounded-lg text-sm font-medium hover:bg-brand-orange/90 transition">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Criar Agendamento
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function preencherCliente(select) {
    const opt = select.options[select.selectedIndex];
    if (opt.value) {
        document.getElementById('campo-nome').value = opt.dataset.nome || '';
        document.getElementById('campo-email').value = opt.dataset.email || '';
        document.getElementById('campo-telefone').value = opt.dataset.telefone || '';
    }
}
</script>
{% endblock %}
