{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Cancelado — 3M Consultoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { dark: '#8C103C', red: '#D83341', orange: '#FE8103' } }, fontFamily: { display: ['"Red Hat Display"', 'system-ui'], body: ['Inter', 'system-ui'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Red+Hat+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', system-ui, sans-serif; } h1,h2,h3 { font-family: 'Red Hat Display', system-ui, sans-serif; }</style>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-red-100 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </div>
        <h1 class="text-2xl font-display font-bold text-gray-900 mb-2">Agendamento Cancelado</h1>
        <p class="text-sm text-gray-500">O agendamento do dia {{ agendamento.data_hora|date:"d/m/Y" }} às {{ agendamento.data_hora|time:"H:i" }} foi cancelado com sucesso.</p>
        <p class="text-xs text-gray-400 mt-6"><span class="font-semibold text-brand-dark">3M Consultoria</span></p>
    </div>
</body>
</html>
