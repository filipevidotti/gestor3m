{% extends "base.html" %}

{% block title %}Upload {{ tipo }} — {{ cliente.empresa }} — 3M Control{% endblock %}
{% block page_title %}Upload {{ tipo }}: {{ cliente.empresa }}{% endblock %}

{% block content %}
<div class="max-w-xl space-y-6">
    <a href="{% url back_url cliente.pk %}" class="text-xs text-gray-400 dark:text-gray-500 hover:text-brand-orange transition">&larr; Voltar</a>

    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div class="bg-white dark:bg-dark-100 rounded-xl p-6 border border-gray-200 dark:border-gray-700/50 space-y-5">
            <h3 class="text-lg font-display font-semibold text-gray-900 dark:text-white">Importar {{ tipo }}</h3>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-2">Período <span class="text-red-400">*</span></label>
                <select name="periodo" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-dark border border-gray-700 rounded-lg text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent">
                    {% for value, label in periodo_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-2">Data de Referência <span class="text-red-400">*</span></label>
                <input type="date" name="data_referencia" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-dark border border-gray-700 rounded-lg text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-2">Planilha (.xlsx ou .csv) <span class="text-red-400">*</span></label>
                <input type="file" name="arquivo" accept=".xlsx,.xls,.csv" required
                    class="w-full px-4 py-2.5 bg-gray-50 dark:bg-dark border border-gray-700 rounded-lg text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-sm file:bg-brand-orange/10 file:text-brand-orange">
            </div>
        </div>

        <div class="flex justify-end gap-3">
            <a href="{% url back_url cliente.pk %}" class="px-4 py-2.5 bg-dark-200 hover:bg-dark-200/80 text-gray-700 dark:text-gray-200 text-sm font-medium rounded-lg border border-gray-200 dark:border-gray-700/50 transition">Cancelar</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-orange hover:bg-brand-orange/90 text-white text-sm font-semibold rounded-lg transition">
                Importar {{ tipo }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
