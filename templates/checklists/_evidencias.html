<div class="flex items-center gap-3 mt-2">
    {% for ev in evidencias %}
    <div class="w-16 h-16 rounded-lg overflow-hidden border border-gray-200 dark:border-gray-700/50">
        <img src="{{ ev.file.url }}" alt="{{ ev.description }}" class="w-full h-full object-cover">
    </div>
    {% endfor %}
    <span class="text-xs text-success">Enviada!</span>
</div>
