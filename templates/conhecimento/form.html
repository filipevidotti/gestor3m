{% extends "base.html" %}
{% block title %}{{ form_title }} — 3M Control{% endblock %}
{% block page_title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div class="bg-white dark:bg-dark-100 rounded-xl border border-gray-200 dark:border-gray-700/50 p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Título *</label>
                <input type="text" name="titulo" value="{{ dados.titulo }}" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Resumo</label>
                <input type="text" name="resumo" value="{{ dados.resumo }}" maxlength="500" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange" placeholder="Breve descrição...">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categoria</label>
                    <select name="categoria" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange">
                        <option value="">Sem categoria</option>
                        {% for c in categorias %}
                        <option value="{{ c.pk }}" {% if dados.categoria == c.pk|stringformat:"d" %}selected{% endif %}>{{ c.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Visibilidade</label>
                    <select name="visibilidade" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange">
                        <option value="todos" {% if dados.visibilidade == 'todos' %}selected{% endif %}>Todos</option>
                        <option value="consultores" {% if dados.visibilidade == 'consultores' %}selected{% endif %}>Apenas Consultores</option>
                        <option value="gestores" {% if dados.visibilidade == 'gestores' %}selected{% endif %}>Apenas Gestores</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="destaque" {% if dados.destaque %}checked{% endif %} class="rounded border-gray-300 text-brand-orange focus:ring-brand-orange">
                        <span class="text-sm text-gray-700 dark:text-gray-300">Destaque</span>
                    </label>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Conteúdo *</label>
                <textarea name="conteudo" rows="20" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange font-mono" placeholder="Escreva o conteúdo do artigo...">{{ dados.conteudo }}</textarea>
            </div>
        </div>
        <div class="flex justify-end gap-3">
            <a href="{% url 'conhecimento:listar' %}" class="px-4 py-2 bg-gray-100 dark:bg-dark-200 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-brand-orange text-white rounded-lg text-sm font-medium hover:bg-orange-600 transition">Publicar</button>
        </div>
    </form>
</div>
{% endblock %}
