{% extends "base.html" %}
{% block title %}Agendar Reunião — CRM — 3M Control{% endblock %}
{% block page_title %}Agendar Reunião{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="mb-4">
        <a href="{% url 'crm:detalhe_lead' lead.pk %}" class="text-xs text-gray-400 hover:text-brand-orange transition">&larr; Voltar ao Lead: {{ lead.nome }}</a>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div class="bg-white dark:bg-dark-100 rounded-xl border border-gray-200 dark:border-gray-700/50 p-6 space-y-4">
            <h3 class="text-sm font-display font-semibold text-gray-900 dark:text-white">Reunião com {{ lead.nome }}</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Data e hora *</label>
                    <input type="datetime-local" name="data_hora" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Duração (min)</label>
                    <input type="number" name="duracao" value="60" min="15" step="15" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Observação</label>
                <textarea name="observacao" rows="3" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange" placeholder="Pauta da reunião..."></textarea>
            </div>
        </div>
        <div class="flex justify-end gap-3">
            <a href="{% url 'crm:detalhe_lead' lead.pk %}" class="px-4 py-2 bg-gray-100 dark:bg-dark-200 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition">Agendar</button>
        </div>
    </form>
</div>
{% endblock %}
