<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado! — 3M Consultoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Red+Hat+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } h1 { font-family: 'Red Hat Display', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="text-center max-w-md">
        <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-green-100 flex items-center justify-center">
            <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Obrigado pela sua avaliação!</h1>
        <p class="text-gray-500 mt-3">Sua nota: <span class="font-bold {% if resposta.nota >= 9 %}text-green-500{% elif resposta.nota >= 7 %}text-orange-500{% else %}text-red-500{% endif %}">{{ resposta.nota }}/10</span></p>
        <p class="text-sm text-gray-400 mt-6">3M Consultoria</p>
    </div>
</body>
</html>
