<tr id="anuncio-{{ an.pk }}">
    <td class="px-5 py-4 text-xs font-mono text-gray-600 dark:text-gray-300">{{ an.mlb }}</td>
    <td class="px-5 py-4 text-gray-700 dark:text-gray-200">{{ an.titulo|truncatechars:50 }}</td>
    <td class="px-5 py-4 text-center">
        {% if an.precisa_foto %}
            {% if an.foto_feito %}
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Feito
            </span>
            {% else %}
            <form hx-post="{% url 'portal:anuncio_marcar_feito' an.pk %}"
                  hx-target="#anuncio-{{ an.pk }}"
                  hx-swap="outerHTML"
                  hx-confirm="Marcar foto como feita?">
                {% csrf_token %}
                <input type="hidden" name="tipo" value="foto">
                <button type="submit" class="px-3 py-1 bg-brand-orange/10 text-brand-orange rounded-lg text-xs font-medium hover:bg-brand-orange/20 transition">
                    Marcar Feito
                </button>
            </form>
            {% endif %}
        {% else %}
        <span class="text-xs text-gray-400">—</span>
        {% endif %}
    </td>
    <td class="px-5 py-4 text-center">
        {% if an.precisa_video %}
            {% if an.video_feito %}
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Feito
            </span>
            {% else %}
            <form hx-post="{% url 'portal:anuncio_marcar_feito' an.pk %}"
                  hx-target="#anuncio-{{ an.pk }}"
                  hx-swap="outerHTML"
                  hx-confirm="Marcar vídeo como feito?">
                {% csrf_token %}
                <input type="hidden" name="tipo" value="video">
                <button type="submit" class="px-3 py-1 bg-brand-orange/10 text-brand-orange rounded-lg text-xs font-medium hover:bg-brand-orange/20 transition">
                    Marcar Feito
                </button>
            </form>
            {% endif %}
        {% else %}
        <span class="text-xs text-gray-400">—</span>
        {% endif %}
    </td>
</tr>
