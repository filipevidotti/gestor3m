{% extends "base.html" %}
{% block title %}Gerar Relatório — {{ cliente.empresa }} — 3M Control{% endblock %}
{% block page_title %}Gerar Relatório{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div class="bg-white dark:bg-dark-100 rounded-xl border border-gray-200 dark:border-gray-700/50 p-6">
            <h3 class="text-lg font-display font-semibold text-gray-900 dark:text-white mb-1">{{ cliente.empresa }}</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Selecione o mês/ano do relatório</p>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mês</label>
                    <select name="mes" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange">
                        {% for m in "123456789" %}<option value="{{ m }}" {% if m|add:"0" == mes_atual %}selected{% endif %}>{{ m }}</option>{% endfor %}
                        <option value="10" {% if mes_atual == 10 %}selected{% endif %}>10</option>
                        <option value="11" {% if mes_atual == 11 %}selected{% endif %}>11</option>
                        <option value="12" {% if mes_atual == 12 %}selected{% endif %}>12</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ano</label>
                    <input type="number" name="ano" value="{{ ano_atual }}" min="2024" max="2030" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark px-3 py-2 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-orange">
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-3">
            <a href="{% url 'relatorios:listar' %}" class="px-4 py-2 bg-gray-100 dark:bg-dark-200 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-brand-orange text-white rounded-lg text-sm font-medium hover:bg-orange-600 transition">Gerar Relatório</button>
        </div>
    </form>
</div>
{% endblock %}
